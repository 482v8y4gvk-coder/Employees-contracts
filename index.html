<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>عقود العمال — مزامنة سحابية</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #f4f6f9; color: #1e293b; padding: 16px; }
    .container { max-width: 840px; margin: 0 auto; }
    .card { background: #fff; border-radius: 12px; padding: 18px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    h1, h2, h3 { margin-top: 0; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
    input, select, button { padding: 10px 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 15px; }
    input, select { flex: 1; min-width: 170px; }
    button { background: #0f172a; color: #fff; border: none; cursor: pointer; font-weight: 600; }
    button.secondary { background: #475569; }
    button.danger { background: #dc2626; padding: 6px 10px; font-size: 13px; }
    .status { font-size: 13px; padding: 10px 12px; border-radius: 8px; background: #e2e8f0; margin-bottom: 12px; line-height: 1.5; }
    .status.ok { background: #dcfce7; color: #166534; }
    .status.err { background: #fee2e2; color: #991b1b; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { text-align: right; padding: 10px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    .hidden { display: none; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="container">
    <div id="cloudStatus" class="status">جارٍ الاتصال بقاعدة البيانات السحابية Firestore...</div>

    <!-- شاشة تسجيل الدخول أو إنشاء أول حساب -->
    <div id="authSection" class="card">
      <h2 id="authTitle">تسجيل الدخول</h2>
      <div class="row">
        <input id="authUsername" type="text" placeholder="اسم المستخدم" autocomplete="username" />
        <input id="authPassword" type="password" placeholder="كلمة المرور" autocomplete="current-password" />
      </div>
      <div class="row">
        <button id="loginBtn" type="button">دخول</button>
        <button id="registerBtn" type="button" class="secondary">إنشاء حساب جديد</button>
      </div>
      <p id="authHint" style="font-size:13px;color:#64748b;margin:6px 0 0;"></p>
    </div>

    <!-- شاشة التطبيق بعد الدخول -->
    <div id="appSection" class="hidden">
      <div class="card topbar">
        <div>
          <strong>مرحباً، <span id="currentUserLabel"></span></strong>
          <span id="roleBadge" style="font-size:12px;color:#475569;margin-right:8px;"></span>
        </div>
        <button id="logoutBtn" type="button" class="secondary">خروج</button>
      </div>

      <div class="card">
        <h3>إضافة عامل / عقد جديد</h3>
        <form id="workerForm">
          <div class="row">
            <input id="workerName" type="text" placeholder="اسم العامل" required />
            <input id="workerNationalId" type="text" placeholder="الرقم القومي (14 رقماً)" maxlength="14" required />
          </div>
          <div class="row">
            <input id="workerRole" type="text" placeholder="الوظيفة / القسم" required />
            <input id="workerStartDate" type="date" required />
            <select id="workerStatus">
              <option value="ساري">ساري</option>
              <option value="تحت التجربة">تحت التجربة</option>
              <option value="منتهي">منتهي</option>
            </select>
          </div>
          <button type="submit">حفظ في السحابة</button>
        </form>
      </div>

      <div class="card">
        <h3>قائمة العمال (<span id="workersCount">0</span>)</h3>
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>الاسم</th>
                <th>الرقم القومي</th>
                <th>الوظيفة</th>
                <th>تاريخ البداية</th>
                <th>الحالة</th>
                <th>إجراء</th>
              </tr>
            </thead>
            <tbody id="workersTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import {
      initializeFirestore,
      persistentLocalCache,
      persistentMultipleTabManager,
      collection,
      doc,
      setDoc,
      deleteDoc,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    // إزالة أي Service Worker قديم كان يثبّت نسخة قديمة من التطبيق على الأجهزة
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then((registrations) => {
        registrations.forEach((reg) => reg.unregister());
      }).catch(() => {});
    }

    // إعداد مشروع Firebase: employees-contracts
    const firebaseConfig = {
      apiKey: "AIzaSyA-YOUR-API-KEY",
      authDomain: "employees-contracts.firebaseapp.com",
      projectId: "employees-contracts",
      storageBucket: "employees-contracts.appspot.com",
      messagingSenderId: "000000000000",
      appId: "1:000000000000:web:000000000000000000"
    };

    const app = initializeApp(firebaseConfig);
    const db = initializeFirestore(app, {
      localCache: persistentLocalCache({
        tabManager: persistentMultipleTabManager()
      })
    });

    const usersCol = collection(db, "users");
    const workersCol = collection(db, "workers");

    let usersCache = [];
    let workersCache = [];
    let currentUser = JSON.parse(sessionStorage.getItem("activeContractUser") || "null");

    const statusEl = document.getElementById("cloudStatus");
    const authSection = document.getElementById("authSection");
    const appSection = document.getElementById("appSection");
    const authTitle = document.getElementById("authTitle");
    const authHint = document.getElementById("authHint");
    const authUsername = document.getElementById("authUsername");
    const authPassword = document.getElementById("authPassword");
    const currentUserLabel = document.getElementById("currentUserLabel");
    const roleBadge = document.getElementById("roleBadge");
    const workersTableBody = document.getElementById("workersTableBody");
    const workersCount = document.getElementById("workersCount");

    function setStatus(text, type = "") {
      statusEl.textContent = text;
      statusEl.className = "status " + type;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderAuthState() {
      if (currentUser) {
        authSection.classList.add("hidden");
        appSection.classList.remove("hidden");
        currentUserLabel.textContent = currentUser.username;
        roleBadge.textContent = currentUser.role === "admin" ? "(مدير)" : "(مستخدم)";
        renderWorkers();
      } else {
        appSection.classList.add("hidden");
        authSection.classList.remove("hidden");
        if (usersCache.length === 0) {
          authTitle.textContent = "إنشاء حساب المدير الأول";
          authHint.textContent = "لا يوجد حساب مسجّل في السحابة بعد؛ إنشاء أول حساب سيجعله مديراً تلقائياً ويحفظه في مجموعة users.";
        } else {
          authTitle.textContent = "تسجيل الدخول";
          authHint.textContent = "سجّل الدخول بحسابك المسجّل في السحابة.";
        }
      }
    }

    function renderWorkers() {
      workersCount.textContent = workersCache.length;
      workersTableBody.innerHTML = "";
      if (workersCache.length === 0) {
        workersTableBody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#64748b;">لا توجد سجلات عمال بعد</td></tr>`;
        return;
      }
      workersCache.forEach((w) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${escapeHtml(w.name || "")}</td>
          <td>${escapeHtml(w.nationalId || "")}</td>
          <td>${escapeHtml(w.role || "")}</td>
          <td>${escapeHtml(w.startDate || "")}</td>
          <td>${escapeHtml(w.status || "")}</td>
          <td><button class="danger" type="button" data-id="${escapeHtml(w.id)}">حذف</button></td>
        `;
        tr.querySelector("button").addEventListener("click", async () => {
          try {
            await deleteDoc(doc(db, "workers", w.id));
            setStatus("تم حذف السجل ومزامنته مع السحابة.", "ok");
          } catch (err) {
            setStatus("تعذّر الحذف من السحابة: " + err.message, "err");
          }
        });
        workersTableBody.appendChild(tr);
      });
    }

    // الاستماع اللحظي لمجموعة users
    onSnapshot(usersCol, { includeMetadataChanges: true }, (snap) => {
      usersCache = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      const sourceLabel = snap.metadata.fromCache ? " (ذاكرة محلية — بانتظار مزامنة الخادم)" : " (متصل بالخادم السحابي)";
      setStatus("متصل بـ Firestore — مزامنة لحظية مفعّلة" + sourceLabel, "ok");
      renderAuthState();
    }, (err) => {
      setStatus("خطأ في الاتصال بـ Firestore (users): " + err.message, "err");
    });

    // الاستماع اللحظي لمجموعة workers
    onSnapshot(workersCol, (snap) => {
      workersCache = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      renderWorkers();
    }, (err) => {
      setStatus("خطأ في قراءة العمال من Firestore: " + err.message, "err");
    });

    // إنشاء حساب جديد وحفظه في مجموعة users
    document.getElementById("registerBtn").addEventListener("click", async () => {
      const username = authUsername.value.trim();
      const password = authPassword.value;
      if (!username || !password) {
        setStatus("يرجى إدخال اسم المستخدم وكلمة المرور.", "err");
        return;
      }
      const exists = usersCache.some((u) => u.username === username);
      if (exists) {
        setStatus("اسم المستخدم موجود بالفعل، استخدم تسجيل الدخول.", "err");
        return;
      }
      const role = usersCache.length === 0 ? "admin" : "user";
      const docId = encodeURIComponent(username);
      try {
        await setDoc(doc(db, "users", docId), {
          username,
          password,
          role,
          createdAt: new Date().toISOString()
        });
        currentUser = { username, role };
        sessionStorage.setItem("activeContractUser", JSON.stringify(currentUser));
        setStatus("تم إنشاء الحساب وحفظه في مجموعة users بـ Firestore.", "ok");
        renderAuthState();
      } catch (err) {
        setStatus("تعذّر حفظ الحساب في السحابة: " + err.message, "err");
      }
    });

    // تسجيل الدخول
    document.getElementById("loginBtn").addEventListener("click", () => {
      const username = authUsername.value.trim();
      const password = authPassword.value;
      const found = usersCache.find((u) => u.username === username && u.password === password);
      if (!found) {
        setStatus("بيانات الدخول غير صحيحة أو الحساب غير موجود.", "err");
        return;
      }
      currentUser = { username: found.username, role: found.role || "user" };
      sessionStorage.setItem("activeContractUser", JSON.stringify(currentUser));
      setStatus("تم تسجيل الدخول بنجاح.", "ok");
      renderAuthState();
    });

    // تسجيل الخروج
    document.getElementById("logoutBtn").addEventListener("click", () => {
      currentUser = null;
      sessionStorage.removeItem("activeContractUser");
      authUsername.value = "";
      authPassword.value = "";
      renderAuthState();
    });

    // إضافة عامل جديد وحفظه في مجموعة workers
    document.getElementById("workerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("workerName").value.trim();
      const nationalId = document.getElementById("workerNationalId").value.trim();
      const role = document.getElementById("workerRole").value.trim();
      const startDate = document.getElementById("workerStartDate").value;
      const status = document.getElementById("workerStatus").value;
      if (!name || !nationalId || !role || !startDate) return;

      const id = nationalId + "_" + Date.now();
      try {
        await setDoc(doc(db, "workers", id), {
          name,
          nationalId,
          role,
          startDate,
          status,
          createdBy: currentUser?.username || "unknown",
          updatedAt: new Date().toISOString()
        });
        e.target.reset();
        setStatus("تم حفظ العامل في مجموعة workers بـ Firestore.", "ok");
      } catch (err) {
        setStatus("تعذّر حفظ العامل في السحابة: " + err.message, "err");
      }
    });

    renderAuthState();
  </script>
</body>
</html>
