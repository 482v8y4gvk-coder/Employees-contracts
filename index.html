<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="عقود العمال">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>متابعة عقود العمال</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f4;--card:#fff;--ink:#14212b;--mute:#5b6b76;--line:#d5dee2;--acc:#0f766e;--accfg:#fff;--ok:#15803d;--okbg:#dcf3e4;--warn:#92400e;--warnbg:#fde9c4;--bad:#b91c1c;--badbg:#fbdcdc;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e171c;--card:#16232a;--ink:#e6eef1;--mute:#93a5ae;--line:#27383f;--acc:#2dd4bf;--accfg:#06201d;--ok:#6ee7a0;--okbg:#143324;--warn:#fbbf6a;--warnbg:#3a2a0e;--bad:#fca5a5;--badbg:#3d1717;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e171c;--card:#16232a;--ink:#e6eef1;--mute:#93a5ae;--line:#27383f;--acc:#2dd4bf;--accfg:#06201d;--ok:#6ee7a0;--okbg:#143324;--warn:#fbbf6a;--warnbg:#3a2a0e;--bad:#fca5a5;--badbg:#3d1717;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:20px 16px}
h1{font-size:26px;margin:4px 0 2px;font-weight:700}
h2{font-size:18px;margin:24px 0 10px;font-weight:700}
.sub{color:var(--mute);margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:30px;line-height:1.2}
.stat span{font-size:14px;color:var(--mute)}
.stat.ok b{color:var(--ok)}.stat.warn b{color:var(--warn)}.stat.bad b{color:var(--bad)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:14px 16px;min-height:48px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.primary{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:700}
.danger{color:var(--bad);border-color:var(--bad);font-weight:700}
.alert{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px}
.alert.bad{background:var(--badbg);color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.head strong{font-size:18px}
.badge{font-size:13px;font-weight:700;border-radius:99px;padding:2px 12px;white-space:nowrap}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.bad{background:var(--badbg);color:var(--bad)}
dl{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:0}
dt{font-size:13px;color:var(--mute)}dd{margin:0;font-weight:500}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.empty{text-align:center;color:var(--mute);padding:28px 8px}
nav{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:6px}
nav button{flex:1;border:0;background:none;border-radius:10px;font-weight:500;color:var(--mute)}
nav button[aria-current="true"]{background:var(--acc);color:var(--accfg);font-weight:700}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);width:min(92vw,460px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
input,select{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:46px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chip{padding:8px 14px;min-height:40px;border-radius:99px;font-size:15px}.chip[aria-pressed="true"]{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:700}.pick{width:100%;text-align:right;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.chk{display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--ink);font-size:15px}.chk input{width:22px;min-height:22px;height:22px}.nid{direction:ltr;text-align:right;letter-spacing:1px}
:root{--accbg:#d6efec}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accbg:#123a36}}:root[data-theme="dark"]{--accbg:#123a36}.stats{grid-template-columns:repeat(2,1fr)}.stat.perm b{color:var(--acc)}.stat.term b{color:var(--mute)}.badge.perm{background:var(--accbg);color:var(--acc)}.badge.term{background:var(--line);color:var(--mute)}.hist{margin:12px 0 0;padding:0;list-style:none;font-size:15px}.hist li{padding:6px 0;border-top:1px solid var(--line)}.note{background:var(--accbg);color:var(--acc);border-radius:10px;padding:8px 12px;margin-top:10px;font-size:15px}.hint{font-size:13px;color:var(--mute);margin-top:4px}.full{grid-column:1/-1}.stack{display:grid;gap:10px;margin-top:12px}
nav[hidden]{display:none}.auth{margin-top:8vh}
</style>
</head>
<body>
<main id="app"></main>
<nav>
<button data-v="home">الرئيسية</button>
<button data-v="status">حالة العمال</button>
<button data-v="list">صفحة العامل</button>
<button data-v="users" hidden>المستخدمون</button>
</nav>

<dialog id="addDlg" class="ent">
<h2 style="margin-top:0" id="fTitle">إضافة عامل</h2>
<label for="fName">اسم العامل</label><input id="fName" autocomplete="off">
<label for="fNid">الرقم القومي (14 رقماً)</label><input id="fNid" class="nid" inputmode="numeric" maxlength="14" autocomplete="off">
<label for="fStart">تاريخ بداية العقد</label><input id="fStart" type="date">
<label for="fDur">مدد العقود بالأشهر (مثال: 12,12,12)</label><input id="fDur" value="12" autocomplete="off"><div class="hint">العقد الأول ثم التجديدات بالترتيب. كل مدة تبدأ تلقائياً بعد انتهاء التي قبلها.</div>
<label for="fIns">تاريخ التسجيل في التأمينات (اختياري)</label><input id="fIns" type="date">
<label class="chk"><input type="checkbox" id="fNoIns" checked> لم يسجل بعد</label>
<label for="fAlert">الإنذار قبل انتهاء العقد (بالأيام)</label><input id="fAlert" type="number" min="1" inputmode="numeric" value="30">
<div class="err" id="fErr" role="alert"></div>
<div class="two"><button class="primary" id="saveBtn">حفظ</button><button id="cancelAdd">إلغاء</button></div>
</dialog>

<dialog id="termDlg" class="ent">
<h2 style="margin-top:0" id="tTitle">إنهاء عقد العامل</h2>
<label for="tDate">تاريخ فسخ العقد</label><input id="tDate" type="date">
<label for="tIns">تاريخ الإخراج من التأمينات (اختياري)</label><input id="tIns" type="date">
<div class="hint">تقدر تضيف تاريخ الإخراج لاحقاً من صفحة العامل.</div>
<div class="err" id="tErr" role="alert"></div>
<div class="stack"><button class="primary" id="tSave">حفظ</button><button class="danger" id="tUndo" hidden>إلغاء إنهاء العقد</button><button data-close="termDlg">إغلاق</button></div>
</dialog>

<dialog id="delDlg" class="ent">
<h2 style="margin-top:0">حذف عامل</h2>
<input id="dq" type="search" placeholder="ابحث بالاسم أو الرقم القومي" autocomplete="off">
<div id="delList" style="margin-top:10px;max-height:50vh;overflow:auto"></div>
<div class="two" style="grid-template-columns:1fr"><button data-close="delDlg">إغلاق</button></div>
</dialog>

<dialog id="pwDlg" class="ent">
<h2 style="margin-top:0" id="pwT">تأكيد كلمة المرور</h2>
<p class="sub" id="pwX"></p>
<label for="pwIn">كلمة المرور</label><input id="pwIn" type="password" autocomplete="current-password">
<div class="err" id="pwErr" role="alert"></div>
<div class="two"><button class="primary" id="pwOk">تأكيد</button><button data-close="pwDlg">إلغاء</button></div>
</dialog>

<dialog id="usrDlg" class="ent">
<h2 style="margin-top:0" id="uTitle">إضافة مستخدم</h2>
<label for="uName">الاسم</label><input id="uName" autocomplete="off">
<label for="uUser">اسم المستخدم (إنجليزي بدون مسافات)</label><input id="uUser" class="nid" autocomplete="off" autocapitalize="none">
<label for="uPass" id="uPassL">كلمة المرور (6 أحرف على الأقل)</label><input id="uPass" type="password" autocomplete="new-password">
<label for="uRole">الصلاحية</label>
<select id="uRole"><option value="viewer">مشاهد (عرض وبحث فقط)</option><option value="editor">مُدخل بيانات (بدون حذف)</option><option value="admin">مدير (كل الصلاحيات)</option><option value="pending">بانتظار الموافقة (بدون وصول)</option></select>
<div class="err" id="uErr" role="alert"></div>
<div class="stack"><button class="primary" id="uSave">حفظ</button><button class="danger" id="uDel" hidden>حذف المستخدم</button><button data-close="usrDlg">إغلاق</button></div>
</dialog>

<input type="file" id="xl" accept=".xlsx,.xls,.csv" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
var KEY="workers-contracts-v1",UKEY="wc-users-v1",SKEY="wc-session",ITER=100000,mem={};
var DB=null,ready=false,slow=false,workers=[],users=[],uReady=false,wReady=false,me=null;
var view="home",filter="all",sel=null,editId=null,q="",dq="",msg="",rId=null,renId=null,renVal="12",tId=null,uEdit=null,pwCb=null,authMode="login",authFirst=false,fails=0;
var ROLES={admin:"مدير",editor:"مُدخل بيانات",viewer:"مشاهد",pending:"بانتظار الموافقة"},RCLS={admin:"perm",editor:"ok",viewer:"term",pending:"warn"};
var H=["الاسم","الرقم القومي","تاريخ بداية العقد","مدد العقود بالأشهر","تاريخ التسجيل في التأمينات","أيام الإنذار","تاريخ فسخ العقد","تاريخ الإخراج من التأمينات","الحالة","تاريخ انتهاء العقد","سنوات العمل"];
function $(id){return document.getElementById(id)}
function lsGet(k){try{var r=localStorage.getItem(k);return r?JSON.parse(r):[]}catch(e){return mem[k]||[]}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}
function normW(w){if(!Array.isArray(w.renewals))w.renewals=[];w.months=+w.months;w.alert=+w.alert||30;w.renewals.forEach(function(r){r.months=+r.months});return w}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function norm(v){return String(v==null?"":v).replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632}).replace(/\s/g,"")}
function nar(v){return String(v).toLowerCase().replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").trim()}
function pd(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){var t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())}
function fmt(d){return (typeof d==="string"?pd(d):d).toLocaleDateString("ar-u-nu-latn",{year:"numeric",month:"long",day:"numeric"})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function digits(v){return String(v==null?"":v).replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632})}
function parseDurs(v){var p=digits(v).split(/[\s,،;؛|]+/).filter(Boolean);if(!p.length)return null;for(var i=0;i<p.length;i++){if(!/^\d+$/.test(p[i])||+p[i]<1)return null}return p.map(Number)}
function addM(st,m){var d=pd(st),e=new Date(d.getFullYear(),d.getMonth()+m,d.getDate());if(e.getDate()!==d.getDate())e=new Date(d.getFullYear(),d.getMonth()+m+1,0);return iso(e)}
function build(st,l){var o={months:l[0],renewals:[]},c=l[0];for(var k=1;k<l.length;k++){o.renewals.push({start:addM(st,c),months:l[k]});c+=l[k]}return o}
function durList(w){return [w.months].concat(w.renewals.map(function(r){return r.months})).join(",")}
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}

/* ---- data layer: shared db when available, otherwise this device only ---- */
var denied="تعذّر الحفظ: لا تملك صلاحية الكتابة في قاعدة البيانات. اطلب من مالك الصفحة منحك صلاحية «Contributor» أو أعلى.";
function fail1(){setMsg(denied)}
function wSet(w){var o=JSON.parse(JSON.stringify(w));if(DB&&!byId(w.id))workers.push(w);if(DB)return DB.doc("workers/"+w.id).set(o).catch(fail1);if(workers.indexOf(w)<0)workers.push(w);lsSet(KEY,workers);return Promise.resolve()}
function wDel(id){if(DB)workers=workers.filter(function(w){return w.id!==id});if(DB)return DB.doc("workers/"+id).delete().catch(fail1);workers=workers.filter(function(w){return w.id!==id});lsSet(KEY,workers);return Promise.resolve()}
function uSet(u){if(DB)users=users.filter(function(x){return x.username!==u.username}).concat([u]);if(DB)return DB.doc("users/"+u.username).set(u).catch(fail1);users=users.filter(function(x){return x.username!==u.username}).concat([u]);lsSet(UKEY,users);return Promise.resolve()}
function uDel(un){if(DB)users=users.filter(function(x){return x.username!==un});if(DB)return DB.doc("users/"+un).delete().catch(fail1);users=users.filter(function(x){return x.username!==un});lsSet(UKEY,users);return Promise.resolve()}
function fresh(s){return !(s.metadata&&s.metadata.fromCache)}
function startDb(db){DB=db;
db.collection("users").onSnapshot(function(s){users=s.docs.map(function(d){return d.data()});if(fresh(s))uReady=true;sync()},function(){slow=true;render()});
db.collection("workers").onSnapshot(function(s){workers=s.docs.map(function(d){var w=d.data();w.id=d.id;return normW(w)});if(fresh(s))wReady=true;sync()},function(){slow=true;render()})}
function startLocal(){DB=null;workers=lsGet(KEY).map(normW);users=lsGet(UKEY);uReady=wReady=true;sync()}
function sync(){ready=uReady&&wReady;
if(!me){try{var u=sessionStorage.getItem(SKEY);if(u)me=users.filter(function(x){return x.username===u})[0]||null}catch(e){}}
var a=document.activeElement;if(ready&&me&&a&&a.id==="rMonths")return;
if(ready&&me&&view==="list"&&!sel&&a&&a.id==="q"){drawPick();return}
render()}
function init(){setTimeout(function(){if(!ready){slow=true;render()}},10000);
if(!(window.claude&&claude.use)){startLocal();return}
claude.use("db").then(function(db){if(db)startDb(db);else startLocal()}).catch(startLocal)}

/* ---- passwords ---- */
function b64(buf){return btoa(String.fromCharCode.apply(null,new Uint8Array(buf)))}
function newSalt(){var a=new Uint8Array(16);crypto.getRandomValues(a);return b64(a)}
function hashPw(pw,salt,it){var enc=new TextEncoder(),sb=Uint8Array.from(atob(salt),function(c){return c.charCodeAt(0)});
return crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]).then(function(k){return crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:sb,iterations:it||ITER},k,256)}).then(b64)}
function newUser(name,un,pw,role){var salt=newSalt();return hashPw(pw,salt,ITER).then(function(h){return{name:name,username:un,role:role,salt:salt,iter:ITER,hash:h}})}
function can(p){var r=me&&me.role;if(r==="admin")return true;if(r==="editor")return p!=="del"&&p!=="users";return false}
function setSess(u){try{sessionStorage.setItem(SKEY,u)}catch(e){}}
function clrSess(){try{sessionStorage.removeItem(SKEY)}catch(e){}}

/* ---- contract logic ---- */
function cur(w){return w.renewals.length?w.renewals[w.renewals.length-1]:{start:w.start,months:w.months}}
function endOf(c){var s=pd(c.start),e=new Date(s.getFullYear(),s.getMonth()+c.months,s.getDate());if(e.getDate()!==s.getDate())e=new Date(s.getFullYear(),s.getMonth()+c.months+1,0);e.setDate(e.getDate()-1);return e}
function endDate(w){return endOf(cur(w))}
function info(w){var t=today(),end=endDate(w),left=Math.round((end-t)/864e5);
if(w.term)return{st:"term",label:"تم إنهاء العقد",left:left};
var h=pd(w.start),five=t>=new Date(h.getFullYear()+5,h.getMonth(),h.getDate());
if(five||left<0)return{st:"perm",label:"عقد دائم",why:five?"بلغ 5 سنوات عمل":"انتهت مدة العقد دون تجديد",five:five,left:left};
return{st:left<=w.alert?"warn":"ok",label:left<=w.alert?"ينتهي قريباً":"ساري",left:left}}
function years(w){var s=pd(w.start),t=w.term?pd(w.term):today();if(s>t)return "لم يبدأ بعد";var m=(t.getFullYear()-s.getFullYear())*12+t.getMonth()-s.getMonth();if(t.getDate()<s.getDate())m--;m=Math.max(m,0);var y=Math.floor(m/12),r=m%12,o=[];if(y)o.push(y===1?"سنة":y===2?"سنتان":y+(y>10?" سنة":" سنوات"));if(r)o.push(r===1?"شهر":r===2?"شهران":r+(r>10?" شهراً":" أشهر"));return o.length?o.join(" و"):"أقل من شهر"}
function dur(m){var y=Math.floor(m/12),r=m%12,o=[];if(y)o.push(y===1?"سنة":y===2?"سنتان":y+" سنوات");if(r)o.push(r===1?"شهر":r===2?"شهران":r+" أشهر");return o.join(" و")+" ("+m+" شهر)"}
function leftTxt(i){return i.left===0?"ينتهي اليوم":"باقي "+i.left+" يوم"}
function sorted(){return workers.slice().sort(function(a,b){return endDate(a)-endDate(b)})}
function byId(id){return workers.filter(function(w){return w.id===id})[0]}
function subline(w,i){return i.st==="term"?"فُسخ العقد في "+fmt(w.term):i.st==="perm"?"عقد دائم · "+i.why:"ينتهي "+fmt(endDate(w))+" · "+leftTxt(i)}
function rowBtn(w){var i=info(w);return '<button class="pick card" data-open="'+w.id+'"><span><strong>'+esc(w.name)+'</strong><span class="sub" style="display:block;margin:0;font-size:14px">'+subline(w,i)+'</span></span><span class="badge '+i.st+'">'+i.label+'</span></button>'}
function setMsg(m){msg=m;render()}
function match(w,t,n){return !t||nar(w.name).indexOf(t)>-1||(n&&w.nid.indexOf(n)>-1)}

/* ---- screens ---- */
function authView(mode){authMode=mode;authFirst=!users.length;var a=$("app"),reg=mode==="register"||authFirst;
a.innerHTML='<div class="card auth ent"><h1>متابعة عقود العمال</h1>'
+(authFirst?'<p class="sub">أنشئ أول حساب. هذا الحساب يصبح مديراً للبرنامج.</p>':'<div class="chips" style="margin:6px 0 14px"><button class="chip" data-auth="login" aria-pressed="'+!reg+'">تسجيل الدخول</button><button class="chip" data-auth="register" aria-pressed="'+reg+'">إنشاء حساب</button></div>')
+(reg?'<label for="aName">الاسم</label><input id="aName" autocomplete="off">':'')
+'<label for="aUser">اسم المستخدم (إنجليزي)</label><input id="aUser" class="nid" autocomplete="username" autocapitalize="none">'
+'<label for="aPass">كلمة المرور</label><input id="aPass" type="password" autocomplete="'+(reg?"new-password":"current-password")+'">'
